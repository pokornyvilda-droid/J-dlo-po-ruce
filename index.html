<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>JÍDLO PO RUCE – pomocník s jídlem doma i na cestách</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f6f2e8;color:#172d25;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;padding-bottom:90px}.head{background:#123f31;color:white;padding:20px 18px;border-radius:0 0 24px 24px}.logo{font-size:23px;font-weight:900}.tag{font-size:12px;opacity:.82;margin-top:4px}main{padding:18px}.page{display:none}.page:target{display:block}.home{display:block}.home:target{display:none}a{text-decoration:none;color:inherit}.hero{margin:8px 0 18px}.hero h1{font-size:clamp(28px,6vw,40px);line-height:1.05;margin:8px 0}.hero p,.muted,.meta{color:#6d7a74;line-height:1.5;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.card,.choice,.meal,.detail,.row{display:block;background:#fff;border:1px solid #e4e1d8;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(18,63,49,.07)}.card .ico{font-size:28px}.card h3,.choice h3,.meal h3{margin:7px 0}.guide{display:block;background:#123f31;color:white;border-radius:22px;padding:20px;margin:14px 0}.guide b{font-size:23px}.btn{display:inline-block;background:#123f31;color:white;border-radius:12px;padding:10px 13px;font-weight:800;margin-top:10px}.secondary{background:#edf5f0;color:#123f31}.meal-list{display:grid;gap:10px}.meal{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{display:inline-block;background:#edf5f0;color:#123f31;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.note{background:white;border-left:4px solid #123f31;border-radius:12px;padding:13px;line-height:1.5;font-size:13px}.row{margin:7px 0}.row input{margin-right:8px}.detail{margin-top:12px}.detail li{margin:6px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e4e1d8;padding:7px 3px;z-index:20}.bottom-inner{max-width:520px;margin:auto;display:flex;justify-content:space-around}.bottom a{text-align:center;font-size:10px;color:#6d7a74;font-weight:700}.bottom b{display:block;font-size:20px}@media(max-width:560px){.grid4{grid-template-columns:repeat(2,1fr)}.meal{align-items:flex-start;flex-direction:column}}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}.bottom{position:static;border:0;background:transparent;padding:0 18px 18px}.bottom-inner{max-width:1100px;background:#fff;border:1px solid #e4e1d8;border-radius:18px;padding:8px}.bottom a{display:flex;gap:7px;align-items:center;font-size:13px}.bottom b{display:inline}}
/* V9 VISUAL FACELIFT */
:root{--ink:#18342b;--green:#174f3d;--green2:#246b52;--cream:#fbf7ef;--paper:#fffdf9;--line:#e9e2d5;--accent:#f27b4d;--gold:#f4c95d;--muted:#718078;--shadow:0 14px 36px rgba(24,52,43,.09)}
body{background:radial-gradient(circle at 8% 0%,#fff3d9 0,transparent 28%),linear-gradient(180deg,#fbf7ef 0,#f5f1e8 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:1180px;padding-bottom:108px}.head{position:relative;overflow:hidden;background:linear-gradient(135deg,#123f31 0%,#1c6049 72%,#2d7b5d 100%);padding:24px 22px 26px;border-radius:0 0 30px 30px;box-shadow:0 12px 30px rgba(18,63,49,.16)}.head:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-55px;top:-80px;background:rgba(244,201,93,.18)}.logo{font-size:25px;letter-spacing:-.5px}.tag{font-size:12px;margin-top:6px;letter-spacing:.2px}
main{padding:22px 18px}.hero{margin:10px 0 20px}.hero h1{font-weight:900;letter-spacing:-1.2px}.hero p,.muted,.meta{color:var(--muted)}
.grid{gap:14px}.grid4{gap:14px}.card,.choice,.meal,.detail,.row{background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}.card{padding:18px;min-height:145px;position:relative;overflow:hidden}.card:after{content:"";position:absolute;right:-25px;bottom:-45px;width:100px;height:100px;border-radius:50%;background:rgba(242,123,77,.08)}.card .ico{font-size:34px}.card h3,.choice h3,.meal h3{font-size:17px;letter-spacing:-.2px}.card p{margin-bottom:0}.choice{padding:18px;min-height:82px}.choice h3{margin:0}.card:active,.choice:active,.meal:active,.btn:active{transform:scale(.985)}
.guide{position:relative;overflow:hidden;background:linear-gradient(135deg,#174f3d,#2c7b5c);border-radius:26px;padding:23px;margin:16px 0 18px;box-shadow:0 16px 35px rgba(23,79,61,.2)}.guide:after{content:"🥕";position:absolute;font-size:88px;right:-5px;bottom:-24px;opacity:.12;transform:rotate(-12deg)}.guide b{font-size:24px;letter-spacing:-.7px;display:block}.guide p{max-width:80%;margin:7px 0;color:rgba(255,255,255,.78);font-size:13px}.btn{background:var(--green);border-radius:14px;padding:11px 15px;box-shadow:0 7px 18px rgba(23,79,61,.14)}.guide .btn{position:relative;z-index:1}.secondary{background:#eef5ef;color:var(--green);box-shadow:none}
.grid4 .card{min-height:120px}.meal-list{gap:12px}.meal{padding:16px 17px;min-height:70px}.meal h3{margin:0;line-height:1.25}.pill{background:#edf5f0;color:var(--green);padding:7px 10px;border-radius:999px}.detail{padding:20px}.detail h1,.detail h2{letter-spacing:-.5px}.detail h2{margin-top:20px}.note{background:#fff7e5;border-left:0;border-top:3px solid var(--gold);border-radius:14px;padding:14px}.row{padding:13px 15px}.bottom{background:rgba(255,253,249,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(24,52,43,.06)}.bottom a{color:#74827b}.bottom a:first-child{color:var(--green)}
@media(min-width:700px){main{padding:28px 26px}.hero h1{font-size:44px}.home>.grid:first-of-type{grid-template-columns:repeat(4,1fr)}.guide{padding:28px}.guide b{font-size:30px}.meal-list{grid-template-columns:repeat(2,1fr)}.detail{max-width:850px;margin:14px auto}.head{padding-left:28px;padding-right:28px}}
@media(min-width:1000px){.app{padding-bottom:30px}.head{margin:0 12px}.home>.grid:first-of-type{gap:18px}.card{min-height:165px}.bottom-inner{box-shadow:var(--shadow)}}

/* V10 PHOTO IDENTITY */
.visual-hero{position:relative;margin:0 -2px 22px;height:430px;border-radius:30px;overflow:hidden;background:#174f3d url("rs-hero.png") center top/cover no-repeat;box-shadow:0 20px 45px rgba(24,52,43,.16);isolation:isolate}.visual-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,48,37,.04) 35%,rgba(12,48,37,.58) 100%);z-index:0}.visual-hero-copy{position:absolute;left:20px;right:20px;bottom:18px;z-index:1;color:#fff}.visual-hero-copy strong{display:inline-block;background:#174f3d;padding:8px 12px;border-radius:999px;font-size:12px;letter-spacing:.2px}.visual-hero-copy h2{font-size:28px;line-height:1.02;margin:8px 0 4px;letter-spacing:-.7px}.visual-hero-copy p{margin:0;color:rgba(255,255,255,.88);font-size:13px}.photo-band{margin:18px 0;padding:18px;border-radius:24px;background:linear-gradient(135deg,#e9f3e7,#fff7e5);border:1px solid #e3dfd2;display:flex;gap:14px;align-items:center}.photo-band .big{font-size:42px}.photo-band h3{margin:0 0 4px}.photo-band p{margin:0;color:#718078;font-size:13px;line-height:1.45}@media(min-width:700px){.visual-hero{height:520px}.visual-hero-copy{left:28px;bottom:24px}.visual-hero-copy h2{font-size:38px}.home>.visual-hero{margin-bottom:26px}}

/* V15 — FOTO IDENTITA PRO CELOU APPKU */
.page{position:relative;min-height:calc(100vh - 36px);padding:22px 16px 110px!important;overflow:hidden;background-size:cover;background-position:center top;background-attachment:scroll}
.page:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,241,229,.72) 0%,rgba(247,241,229,.88) 32%,rgba(247,241,229,.95) 100%);z-index:0}
.page>*{position:relative;z-index:1}
.page>.btn.secondary{background:rgba(255,253,249,.88);backdrop-filter:blur(10px)}
.page .hero h1,.page>h1{font-weight:900;letter-spacing:-1px}
.page .detail,.page .meal,.page .choice,.page .row,.page .note{backdrop-filter:blur(12px);background:rgba(255,253,249,.88);border-color:rgba(255,255,255,.7);box-shadow:0 12px 32px rgba(18,63,49,.12)}
.page .meal{transition:transform .15s ease}
.page .meal:active,.page .choice:active{transform:scale(.985)}
#doma,#domavysledky{background-image:url('family.jpg')}
#trenink,#postdoma,#postobchod,#postbenzin,#postrest,#postvice{background-image:url('fitness.jpg')}
#cesty,#cestobchod,#cestbenz,#cestrest,#cestmicro{background-image:url('travel.jpg')}
#rychle,#q1,#q2,#q3,#dop,#jidla,#fotojidlo{background-image:url('food.jpg')}
#mamdoma,#fotodom,#nakup,#nakup-pomoc,#nakup-plan{background-image:url('food.jpg')}
#profil,#vlastni{background-image:url('family.jpg')}
[id^="j"]{background-image:url('food.jpg')}
@media(min-width:700px){.page{max-width:920px;margin:18px auto;border-radius:30px;min-height:calc(100vh - 80px);padding:28px 28px 120px!important;box-shadow:0 20px 60px rgba(18,63,49,.16)}.page:before{border-radius:30px}.page .meal-list{grid-template-columns:repeat(2,1fr)}}
